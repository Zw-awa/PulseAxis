name: Bug report / Bug 反馈
description: Report a repository or documentation problem / 提交仓库或文档问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this template for repository, documentation, or workflow bugs.
        请使用这个模板报告仓库、文档或工作流问题。
  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题摘要
      description: What is broken? / 哪里有问题？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现方式
      description: How can the maintainer reproduce it? / 维护者如何复现？
      placeholder: |
        1. Open ... / 打开 ...
        2. Click ... / 点击 ...
        3. Observe ... / 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
      description: What did you expect to happen? / 你原本期望发生什么？
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes / 补充说明
      description: Logs, screenshots, links, or anything helpful / 日志、截图、链接或其他补充信息
