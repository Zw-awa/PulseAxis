name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repository-bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap check
        shell: bash
        run: |
          test -f README.md
          test -f .github/workflows/ci.yml
          test -f .github/workflows/pages.yml

      - name: Check site links
        run: node scripts/check-site-links.mjs
